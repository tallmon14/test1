<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />

<style>
  :root {
    --bg: #f5f4f0; --panel: #ffffff; --ink: #14110d; --ink-2: #4b463e; --ink-3: #8b8579;
    --line: #e6e2d8; --line-2: #efece4; --accent: #6a3df5; --accent-soft: #efeaff;
    --warn: #c2510a; --warn-soft: #fbe9d6; --ok: #2f7a4d; --ok-soft: #e0efe3;
    --bad: #b13438; --bad-soft: #fadddd; --agent-bg: #161311; --agent-ink: #f4efe6;
    --agent-ink-2: #a59f93; --agent-line: #2a2622; --agent-accent: #c9b8ff;
    --radius: 10px; --radius-sm: 6px; --density-row: 36px; --density-pad: 14px;
  }
  [data-density="compact"] { --density-row: 30px; --density-pad: 10px; }
  [data-theme="dark"] {
    --bg: #0f0d0b; --panel: #181512; --ink: #f4efe6; --ink-2: #c9c2b3; --ink-3: #837d70;
    --line: #2a2622; --line-2: #221e1a; --accent: #b89dff; --accent-soft: #2a2237;
    --warn-soft: #3a2614; --ok-soft: #1c2e22; --bad-soft: #3a1d1d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #0a0908; }
  #stage-inner { width: 1440px; height: 900px; position: absolute; top: 50%; left: 50%; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  ::-webkit-scrollbar-track { background: transparent; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Fraunces', serif; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  .caret { display: inline-block; width: 7px; height: 13px; background: currentColor; vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 320ms cubic-bezier(.2,.7,.2,1) both; }
</style>
</head>
<body>
<div id="stage"><div id="stage-inner"><div id="root"></div></div></div>
<script>
  function fitStage() {
    const inner = document.getElementById('stage-inner');
    if (!inner) return;
    const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900, 1);
    inner.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

  messages.push({
